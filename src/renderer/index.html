<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; media-src 'self' blob:">
<title>Vendify Kiosco</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="theme-vendify">
<div id="license" class="hidden"></div>
<div id="app" class="hidden">
  <header>
    <div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Vendify"><rect width="64" height="64" rx="16" fill="#6a47f5"/><path d="M17 21 L32 46" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M32 46 L47 21" fill="none" stroke="#19D3A2" stroke-width="8" stroke-linecap="round"/><circle cx="47" cy="17" r="6" fill="#FF6A3D" stroke="#6a47f5" stroke-width="3"/></svg><span class="wm">vend<b>ify</b></span><span class="shop" id="shopName"></span></div>
    <div class="clock" id="clock"></div>
    <div class="spacer"></div>
    <button class="btn" id="btnTheme" title="Cambiar tema">🌓 Tema</button>
    <button class="btn warn" id="btnClose">🧾 Cerrar Caja / Fin de Turno</button>
    <button class="btn" id="btnAdmin">🔒 Modo Admin</button>
  </header>

  <main id="posView">
    <section class="left">
      <div class="searchbar">
        <input id="search" placeholder="🔎 Buscar por nombre, código o categoría… (F1)" autocomplete="off">
        <button class="btn primary" id="btnCam">📷 Escanear con cámara</button>
      </div>
      <h3>Acceso rápido</h3>
      <div id="quick" class="quick"></div>
      <h3 id="resultsTitle">Productos</h3>
      <div id="results" class="results"></div>
    </section>
    <aside class="right">
      <div class="cart-head"><h2>Ticket</h2><button class="btn small" id="btnClear">🗑 Vaciar (Supr)</button></div>
      <div id="cart" class="cart"></div>
      <div class="totalbox"><span>TOTAL</span><strong id="total">$ 0</strong></div>
      <div class="pay">
        <button class="pay-btn cash" data-pay="cash">💵 Efectivo<small>F2</small></button>
        <button class="pay-btn mp" data-pay="mp">📱 Mercado Pago / QR<small>F3</small></button>
        <button class="pay-btn card" data-pay="card">💳 Transferencia / Tarjeta<small>F4</small></button>
      </div>
    </aside>
  </main>

  <main id="adminView" class="hidden">
    <nav class="tabs" id="adminTabs">
      <button data-tab="stats" class="active">📊 Estadísticas</button>
      <button data-tab="products">📦 Productos y Stock</button>
      <button data-tab="sales">🧾 Historial de ventas</button>
      <button data-tab="closures">🗂 Cierres de caja</button>
      <button data-tab="settings">⚙️ Configuración</button>
    </nav>
    <div id="adminBody"></div>
  </main>
</div>
<footer class="credit">Creado por <a href="https://abrilpoggio.github.io/TheWebLab/" target="_blank" rel="noopener">Abril Poggio · TheWebLab</a></footer>
<div id="modalRoot"></div>
<div id="toasts"></div>
<script src="vendor/zxing.min.js"></script>
<script src="app.js"></script>
<script src="admin.js"></script>
</body>
</html>
